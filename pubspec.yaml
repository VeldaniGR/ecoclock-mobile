name: ecoclock_mobile
description: Eco'clock Network mobile client — donación de cómputo distribuido para monitorización ambiental
publish_to: 'none'
version: 0.5.3+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/logo_apk_neon.png
    
#Configuración del icono de launcher (Android + iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_apk_neon.png"
  adaptive_icon_backround: "#000000"
  adaptive_icon_foreground: "assets/logo_apk_neon.png"
