    <!-- Base -->
    <rect x="42" y="92" width="44" height="10" rx="2"/>
    <!-- Legs -->
    <rect x="48" y="70" width="6" height="24" rx="1"/>
    <rect x="74" y="70" width="6" height="24" rx="1"/>
