name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # botón manual en Actions

jobs:
  build-android:
    name: Build Android (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        include:
          - build-type: debug
            args: --debug --split-per-abi
          - build-type: release
            args: --release --split-per-abi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: Generate platform folders (android/ios)
        run: flutter create --platforms=android,ios --project-name ecoclock_mobile .

      - name: Fix generated test (uses EcoClockApp not MyApp)
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:ecoclock_mobile/main.dart';

          void main() {
            testWidgets('App loads without crashing', (WidgetTester tester) async {
              await tester.pumpWidget(const EcoClockApp());
              expect(find.text('Eco\'clock Network'), findsOneWidget);
            });
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build APK (${{ matrix.build-type }})
        run: flutter build apk ${{ matrix.args }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoclock-mobile-${{ matrix.build-type }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # Opcional: build App Bundle para Play Store
  build-aab:
    name: Build Android App Bundle (release)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: Generate platform folders (android/ios)
        run: flutter create --platforms=android,ios --project-name ecoclock_mobile .

      - name: Fix generated test (uses EcoClockApp not MyApp)
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:ecoclock_mobile/main.dart';

          void main() {
            testWidgets('App loads without crashing', (WidgetTester tester) async {
              await tester.pumpWidget(const EcoClockApp());
              expect(find.text('Eco\'clock Network'), findsOneWidget);
            });
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoclock-mobile-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30