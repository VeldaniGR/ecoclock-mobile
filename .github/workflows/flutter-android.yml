name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # botón manual en Actions

jobs:
  build-android:
    name: Build Android (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        include:
          - build-type: debug
            args: --debug --split-per-abi
          - build-type: release
            args: --release --split-per-abi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Ensure INTERNET permission in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi
          echo "=== AndroidManifest.xml (permisos) ==="
          grep -A5 -E 'uses-permission|package=' "$MANIFEST" || true

      - name: Set launcher app name to Eco'clock
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Eco'\''clock"/' "$MANIFEST"
          echo "=== android:label ==="
          grep -o 'android:label="[^"]*"' "$MANIFEST" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze

      - name: Build APK (${{ matrix.build-type }})
        run: flutter build apk ${{ matrix.args }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoclock-mobile-${{ matrix.build-type }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # Opcional: build App Bundle para Play Store
  build-aab:
    name: Build Android App Bundle (release)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Ensure INTERNET permission in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET"\/>/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi
          echo "=== AndroidManifest.xml (permisos) ==="
          grep -A5 -E 'uses-permission|package=' "$MANIFEST" || true

      - name: Set launcher app name to Eco'clock
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Eco'\''clock"/' "$MANIFEST"
          echo "=== android:label ==="
          grep -o 'android:label="[^"]*"' "$MANIFEST" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoclock-mobile-release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
